<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Commerce Passport</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #06101c;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #1d3043;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout {
            background: #173149;
            color: white;
        }

        main {
            width: min(1050px, calc(100% - 30px));
            margin: 40px auto;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome p {
            color: #9ab0c4;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .product {
            padding: 22px;
            border-radius: 20px;
            background: #0c1b2b;
            border: 1px solid #22364c;
        }

        .product h3 {
            margin-top: 0;
        }

        .detail {
            margin-top: 8px;
            color: #9ab0c4;
            font-size: 14px;
        }

        .empty {
            padding: 30px;
            border-radius: 20px;
            background: #0c1b2b;
            border: 1px solid #22364c;
            color: #9ab0c4;
        }

    </style>

</head>

<body>

    <header>

        <div class="logo">
            Commerce Passport
        </div>

        <button
            class="logout"
            id="logoutBtn"
        >
            Sign out
        </button>

    </header>


    <main>

        <div class="welcome">

            <h1>
                My Commerce Passport
            </h1>

            <p id="userInfo">
                Loading...
            </p>

        </div>


        <div
            class="products"
            id="products"
        >
        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        async function loadPassport() {

            const {

                data: {
                    user
                }

            } =
                await supabaseClient.auth.getUser();


            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }


            document.getElementById(
                "userInfo"
            ).textContent =
                "Signed in as " +
                user.email;


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("purchases")
                    .select(`
                        id,
                        price,
                        currency,
                        purchase_date,
                        receipt_number,
                        products (
                            brand,
                            model,
                            serial_number,
                            category
                        )
                    `)
                    .eq(
                        "customer_id",
                        user.id
                    )
                    .order(
                        "purchase_date",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(error);

                document.getElementById(
                    "products"
                ).innerHTML =
                    `
                    <div class="empty">
                        Could not load your passport.
                        Check the browser console for details.
                    </div>
                    `;

                return;
            }


            const container =
                document.getElementById(
                    "products"
                );


            if (!data.length) {

                container.innerHTML =
                    `
                    <div class="empty">
                        You don't have any registered purchases yet.
                    </div>
                    `;

                return;
            }


            container.innerHTML =
                data
                    .map(purchase => {

                        const product =
                            purchase.products;

                        return `
                            <div class="product">

                                <h3>
                                    ${product.brand}
                                    ${product.model || ""}
                                </h3>

                                <div class="detail">
                                    Category:
                                    ${product.category || "—"}
                                </div>

                                <div class="detail">
                                    Serial:
                                    ${product.serial_number || "—"}
                                </div>

                                <div class="detail">
                                    Price:
                                    ${purchase.currency}
                                    ${purchase.price}
                                </div>

                                <div class="detail">
                                    Purchased:
                                    ${purchase.purchase_date}
                                </div>

                            </div>
                        `;

                    })
                    .join("");

        }


        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                async function() {

                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "login.html";

                }
            );


        loadPassport();

    </script>

</body>

</html>
