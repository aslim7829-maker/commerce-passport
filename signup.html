

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Commerce Passport</title>
  <meta name="theme-color" content="#101828">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f5f9;
      color: #101828;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 16px 45px rgba(16, 24, 40, .08);
    }

    .brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #2563eb;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 29px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #667085;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #2563eb20;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    #message.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
    }

    a { color: #2563eb; }

    .back {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: #667085;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">Commerce Passport</div>
    <h1>Create your account</h1>
    <p class="subtitle">
      Keep your purchase records, warranties and product
      service history connected to your account.
    </p>

    <form id="signupForm">
      <label for="fullName">Full name</label>
      <input
        id="fullName"
        name="fullName"
        type="text"
        autocomplete="name"
        minlength="2"
        maxlength="100"
        placeholder="Your full name"
        required
      >

      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        maxlength="254"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="At least 8 characters"
        required
      >

      <button id="submitButton" type="submit">
        Create account
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="footer">
      Your password is handled by Supabase Authentication.
      Never share your password with anyone.
      <br>
      <a class="back" href="./index.html">
        ← Back to Commerce Passport
      </a>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these two placeholders with your own project values.
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const message = document.getElementById("message");
    const form = document.getElementById("signupForm");
    const button = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    if (
      SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
      SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
    ) {
      showMessage(
        "Setup incomplete: add your Supabase project URL and publishable key in signup.html.",
        "error"
      );
      button.disabled = true;
    } else {
      const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const fullName =
          document.getElementById("fullName").value.trim();
        const email =
          document.getElementById("email").value.trim();
        const password =
          document.getElementById("password").value;

        if (fullName.length < 2) {
          showMessage("Please enter your full name.", "error");
          return;
        }

        button.disabled = true;
        button.textContent = "Creating account...";
        message.className = "";
        message.textContent = "";

        try {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: fullName
              },
              emailRedirectTo: window.location.origin +
                window.location.pathname.replace(
                  /signup\.html$/,
                  "index.html"
                )
            }
          });

          if (error) throw error;

          if (data.session) {
            showMessage(
              "Your account was created and you are signed in. " +
              "Next, we will verify your customer profile.",
              "success"
            );
          } else {
            showMessage(
              "Signup submitted! Check your email for a confirmation link. " +
              "After confirming, we will verify your customer profile.",
              "success"
            );
          }

          form.reset();
        } catch (error) {
          showMessage(
            error.message || "Signup failed. Please try again.",
            "error"
          );
        } finally {
          button.disabled = false;
          button.textContent = "Create account";
        }
      });
    }
  </script>
</body>
</html>
