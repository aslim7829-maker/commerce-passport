
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Commerce Passport</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #f3f5f9;
      color: #101828;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 18px;
      box-shadow: 0 12px 40px #10182812;
    }

    .brand {
      color: #2563eb;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.2px;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 29px;
    }

    .intro {
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #bfdbfe;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      color: white;
      background: #2563eb;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      padding: 13px;
      margin-top: 17px;
      border-radius: 9px;
      line-height: 1.5;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    #message.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #2563eb;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">COMMERCE PASSPORT</div>

    <h1>Create your account</h1>

    <p class="intro">
      Create your customer account to begin connecting your
      purchases, product warranties and service history.
    </p>

    <form id="signupForm">    
      <label for="fullName">Full name</label>
      <input
        id="fullName"
        type="text"
        autocomplete="name"
        minlength="2"
        maxlength="100"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        maxlength="254"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="At least 8 characters"
        required
      >

      <button id="signupButton" type="submit">
        Create account
      </button>
    </form>
<p>Already confirmed your email? <a href="login.html">Sign in</a></p>
    <div id="message" role="status" aria-live="polite"></div>

    <a class="back" href="./index.html">
      ← Back to Commerce Passport
    </a>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these with values from YOUR existing Supabase project.
    const SUPABASE_URL = "https://glzpkrgchzbayztsnkwu.supabase.co";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_BKCqlwyiaQMaDMEf_bdKCA_jh6EX0v7";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    const configured =
      !SUPABASE_URL.includes("YOUR_SUPABASE") &&
      !SUPABASE_PUBLIC_KEY.includes("YOUR_SUPABASE");

    if (!configured) {
      button.disabled = true;
      showMessage(
        "Setup required: add your Supabase project URL and publishable key in this file.",
        "error"
      );
    } else {
      const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY
      );

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const fullName =
          document.getElementById("fullName").value.trim();
        const email =
          document.getElementById("email").value.trim();
        const password =
          document.getElementById("password").value;

        if (fullName.length < 2) {
          showMessage("Please enter your full name.", "error");
          return;
        }

        button.disabled = true;
        button.textContent = "Creating account...";
        message.className = "";
        message.textContent = "";

        try {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: fullName
              },
              emailRedirectTo:
                new URL("./login.html", window.location.href).href
            }
          });

          if (error) {
            throw error;
          }

          if (data.user) {
            if (data.session) {
              showMessage(
                "Your account was created and you are signed in. " +
                "Next, we will check your customer profile.",
                "success"
              );
            } else {
              showMessage(
                "Signup submitted. Check your email for a confirmation link. " +
                "Then we will verify your customer profile.",
                "success"
              );
            }
          } else {
            showMessage(
              "Signup returned no user. Please try again.",
              "error"
            );
          }

          form.reset();

        } catch (error) {
          showMessage(
            "Signup failed: " + (error.message || "Unknown error"),
            "error"
          );
        } finally {
          button.disabled = false;
          button.textContent = "Create account";
        }
      });
    }
  </script>
</body>
</html>
