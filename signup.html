<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Commerce Passport</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #06101c;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(440px, 100%);
            padding: 32px;
            border-radius: 24px;
            background: #0c1b2b;
            border: 1px solid #22364c;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #9ab0c4;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid #30465d;
            background: #071522;
            color: white;
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 22px;
            border: 0;
            border-radius: 10px;
            background: #53e0bb;
            color: #06151e;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 16px;
            color: #9ab0c4;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>Create your Commerce Passport</h1>

        <p>
            Create a test account for your Commerce Passport MVP.
        </p>

        <form id="signupForm">

            <label for="name">
                Full name
            </label>

            <input
                id="name"
                type="text"
                required
                placeholder="Your name"
            >

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                required
                placeholder="you@example.com"
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                required
                minlength="6"
                placeholder="At least 6 characters"
            >

            <button type="submit">
                Create account
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        const form =
            document.getElementById("signupForm");

        const message =
            document.getElementById("message");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                message.textContent =
                    "Creating account...";


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {
                                full_name: name
                            },

                            emailRedirectTo:
                                window.location.origin +
                                "/commerce-passport/"
                        }

                    });


                if (error) {

                    message.textContent =
                        error.message;

                    return;
                }


                message.textContent =
                    "Account created. Check your email if confirmation is required.";

            }
        );

    </script>

</body>

</html>
